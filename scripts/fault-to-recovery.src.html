/* ---------------------------------------------------------------------
   gridData.js  —  centralized mock state (network topology + telemetry)
--------------------------------------------------------------------- */
const NOW = () => Date.now();
const fmtTime = (ts) => new Date(ts).toLocaleTimeString('en-GB', { hour12: false });
const fmtDateTime = (ts) => {
  const d = new Date(ts);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
};

/* ---------------------------------------------------------------------
   apiService.js — thin REST client for the Flask backend.
   All data fetching goes through http://localhost:5000/api/...
   (Phase 1 used an in-memory mock + client-side graph engine; Phase 2
    swaps in the real Python/Flask + networkx API. The React layer is
    unchanged — to retarget, just change API_BASE.)
--------------------------------------------------------------------- */
const API_BASE = 'http://localhost:5000/api';

async function _jfetch(path, opts = {}) {
  const res = await fetch(API_BASE + path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (!res.ok) {
    let msg = 'API error ' + res.status;
    try { const j = await res.json(); if (j && j.error) msg = j.error; } catch (_) {}
    throw new Error(msg);
  }
  return res.json();
}

const apiService = {
  async login(creds) { return _jfetch('/login', { method: 'POST', body: JSON.stringify(creds) }); },
  async getGridState() { return _jfetch('/network/state'); },
  async tickTelemetry() { return _jfetch('/network/state'); },
  async triggerScenario(sid) {
    if (sid === 'S3') return _jfetch('/simulate/reset', { method: 'POST' });
    return _jfetch('/simulate/fault', { method: 'POST', body: JSON.stringify({ scenario: sid }) });
  },
  async executeRestoration() { return _jfetch('/simulate/restore', { method: 'POST' }); },
  async resetGrid() { return _jfetch('/simulate/reset', { method: 'POST' }); },
  async getEventHistory(filters = {}) {
    const qs = new URLSearchParams();
    if (filters.type && filters.type !== 'all') qs.set('type', filters.type);
    if (filters.q) qs.set('q', filters.q);
    const q = qs.toString();
    return _jfetch('/events' + (q ? '?' + q : ''));
  },
};

/* ---------------------------------------------------------------------
   React Context — exposes grid state + actions backed by apiService
--------------------------------------------------------------------- */
const GridCtx = createContext(null);
function useGrid() { const c = useContext(GridCtx); if (!c) throw new Error('useGrid outside provider'); return c; }

function GridProvider({ children }) {
  const [grid, setGrid] = useState(null);
  const [bootError, setBootError] = useState(null);
  const [loading, setLoading] = useState(false);
  const [toast, setToast] = useState(null);
  const loadingRef = useRef(false);
  const mountedRef = useRef(true);

  const showToast = useCallback((msg, kind = 'info') => {
    setToast({ msg, kind, id: NOW() });
    setTimeout(() => setToast(null), 3200);
  }, []);

  const refresh = useCallback(async () => {
    const s = await apiService.getGridState();
    if (mountedRef.current) setGrid(s);
    return s;
  }, []);

  // boot: fetch initial grid state from the backend
  useEffect(() => {
    mountedRef.current = true;
    apiService.getGridState()
      .then((s) => { if (mountedRef.current) setGrid(s); })
      .catch((e) => { if (mountedRef.current) setBootError(e.message || String(e)); });
    return () => { mountedRef.current = false; };
  }, []);

  // live telemetry poll — every 3s from the real backend (skipped while a mutation is in flight)
  useEffect(() => {
    if (!grid) return;
    const id = setInterval(() => {
      if (loadingRef.current) return;
      apiService.getGridState().then((s) => { if (mountedRef.current) setGrid(s); }).catch(() => {});
    }, 3000);
    return () => clearInterval(id);
  }, [grid ? 'on' : 'off']);

  const actions = useMemo(() => ({
    login: async (creds) => apiService.login(creds),
    triggerScenario: async (sid) => {
      loadingRef.current = true; setLoading(true);
      try {
        const s = await apiService.triggerScenario(sid);
        if (mountedRef.current) setGrid(s);
        showToast(sid === 'S3' ? 'Grid reset to healthy state.' : 'Fault scenario injected — protective relays tripping.', sid === 'S3' ? 'success' : 'fault');
        return s;
      } catch (e) { showToast('Scenario failed: ' + (e.message || e), 'fault'); throw e; }
      finally { loadingRef.current = false; setLoading(false); }
    },
    executeRestoration: async () => {
      loadingRef.current = true; setLoading(true);
      try {
        const s = await apiService.executeRestoration();
        if (mountedRef.current) setGrid(s);
        const phase = s.statusPhase;
        showToast(phase === 'restored' ? 'Restoration successful — load re-energised.' : phase === 'no_route' ? 'No feasible route — manual dispatch required.' : 'Restoration executed.', phase === 'restored' ? 'success' : 'fault');
        return s;
      } catch (e) { showToast('Restoration failed: ' + (e.message || e), 'fault'); throw e; }
      finally { loadingRef.current = false; setLoading(false); }
    },
    resetGrid: async () => {
      loadingRef.current = true; setLoading(true);
      try {
        const s = await apiService.resetGrid();
        if (mountedRef.current) setGrid(s);
        showToast('Grid restored to nominal healthy state.', 'success');
        return s;
      } catch (e) { showToast('Reset failed: ' + (e.message || e), 'fault'); throw e; }
      finally { loadingRef.current = false; setLoading(false); }
    },
    refresh,
  }), [refresh, showToast]);

  if (bootError) {
    return (
      <div className="min-h-screen flex items-center justify-center p-4">
        <div className="max-w-md text-center">
          <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-grid-card border border-faulted/40 mb-3">
            <Icon name="alertTriangle" className="w-8 h-8 text-faulted" />
          </div>
          <h1 className="text-xl font-bold text-slate-50">Backend unreachable</h1>
          <p className="text-sm text-slate-400 mt-2">Could not connect to the Flask API at <span className="font-mono text-restoration">http://localhost:5000</span>.</p>
          <p className="text-xs text-slate-500 mt-1">Error: {bootError}</p>
          <p className="text-xs text-slate-500 mt-3">Start it with: <span className="font-mono">cd download/backend &amp;&amp; pip install -r requirements.txt &amp;&amp; python app.py</span></p>
          <button onClick={() => { setBootError(null); apiService.getGridState().then((s) => mountedRef.current && setGrid(s)).catch((e) => mountedRef.current && setBootError(e.message || String(e))); }} className="mt-4 px-4 py-2 rounded-lg bg-restoration text-grid-bg font-semibold text-sm inline-flex items-center gap-2">
            <Icon name="refresh" className="w-4 h-4" />Retry connection
          </button>
        </div>
      </div>
    );
  }

  if (!grid) {
    return (
      <div className="min-h-screen flex items-center justify-center p-4 flex-col gap-4">
        <div className="loader-ring"></div>
        <div className="text-slate-400 text-sm">Connecting to grid control backend…</div>
      </div>
    );
  }

  return (
    <GridCtx.Provider value={{ grid, loading, toast, actions }}>
      {children}
      {toast && <Toast toast={toast} />}
    </GridCtx.Provider>
  );
}

function LineChart({ series, height = 150, yLabel, color = '#06B6D4', min, max, unit }) {
  // series: [{ name, color, data: [{t, v}] }]
  const W = 600, H = height, padL = 34, padR = 8, padT = 10, padB = 18;
  const all = series.flatMap((s) => s.data.map((d) => d.v));
  const lo = min != null ? min : (all.length ? Math.min(...all) : 0);
  const hi = max != null ? max : (all.length ? Math.max(...all) : 1);
  const span = Math.max(0.0001, hi - lo);
  const x = (i, n) => padL + (n <= 1 ? 0 : (i / (n - 1)) * (W - padL - padR));
  const y = (v) => padT + (1 - (v - lo) / span) * (H - padT - padB);
  const gridLines = 4;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ height }}>
      {[...Array(gridLines + 1)].map((_, i) => {
        const gv = lo + (span * i / gridLines);
        const gy = y(gv);
        return (
          <g key={i}>
            <line x1={padL} x2={W - padR} y1={gy} y2={gy} stroke="#1E293B" strokeWidth="1" />
            <text x={padL - 6} y={gy + 3} textAnchor="end" fontSize="9" fill="#64748B" fontFamily="JetBrains Mono, monospace">{gv.toFixed(unit === 'A' ? 0 : 2)}</text>
          </g>
        );
      })}
      {series.map((s) => {
        const n = s.data.length;
        if (!n) return null;
        const d = s.data.map((p, i) => (i === 0 ? 'M' : 'L') + x(i, n).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
        return (
          <g key={s.name}>
            <path d={d} fill="none" stroke={s.color} strokeWidth="1.8" strokeLinejoin="round" strokeLinecap="round" />
            {n > 0 && <circle cx={x(n - 1, n)} cy={y(s.data[n - 1].v)} r="2.6" fill={s.color} />}
          </g>
        );
      })}
      {yLabel && <text x={padL} y={H - 2} fontSize="9" fill="#64748B">{yLabel}</text>}
    </svg>
  );
}

function StatRow({ label, value, good }) {
  return (
    <div className="flex items-center justify-between py-1.5 border-b border-grid-border/40 last:border-0">
      <span className="text-xs text-slate-400">{label}</span>

    </div>

}

/* ---------------------------------------------------------------------
   Interactive Network Map (SVG)
--------------------------------------------------------------------- */
const NODE_STYLE = {
  substation:   { r: 22, icon: 'factory',      fill: '#0F1A2E', stroke: '#38BDF8', label: 'SUB' },
  feeder:       { r: 16, icon: 'zap',          fill: '#0F1A2E', stroke: '#22D3EE', label: 'FDR' },
  transformer:  { r: 15, icon: 'cpu',          fill: '#0F1A2E', stroke: '#A78BFA', label: 'DT' },
  consumer:     { r: 18, icon: 'users',        fill: '#0F1A2E', stroke: '#34D399', label: 'AREA' },
};
const EDGE_COLOR = { healthy: '#10B981', warning: '#F59E0B', faulted: '#EF4444', isolated: '#475569', restoration: '#06B6D4' };

function NetworkMap({ grid, onSelect, selected, highlightEdge, zoomEdge, compact }) {
  const nodes = grid.nodes;
  const edges = grid.edges;
  const VBW = 1000, VBH = 600;

  const nodeById = useMemo(() => Object.fromEntries(nodes.map((n) => [n.id, n])), [nodes]);

  const edgePath = (e) => {
    const a = nodeById[e.from], b = nodeById[e.to];
    if (!a || !b) return '';
    // curved control point for visual flair on long lines
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    if (e.isTie) {
      // tie: gentle S curve
      return `M ${a.x} ${a.y} C ${a.x + 120} ${a.y - 60}, ${b.x - 120} ${b.y - 60}, ${b.x} ${b.y}`;
    }
    return `M ${a.x} ${a.y} L ${b.x} ${b.y}`;
  };

  // zoom transform
  let viewBox = `0 0 ${VBW} ${VBH}`;
  if (zoomEdge) {
    const e = edges.find((x) => x.id === zoomEdge);
    if (e) {
      const a = nodeById[e.from], b = nodeById[e.to];
      const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      const span = 260;
      viewBox = `${cx - span} ${cy - span * 0.6} ${span * 2} ${span * 1.2}`;
    }
  }

  return (
    <svg viewBox={viewBox} className="w-full h-auto select-none" style={{ background: 'radial-gradient(circle at 50% 40%, #0F1A2E, #0B1120 70%)', borderRadius: 12 }}>
      <defs>
        <marker id="arrow-healthy" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
          <path d="M0,0 L7,3 L0,6 Z" fill={EDGE_COLOR.healthy} />
        </marker>
        <marker id="arrow-restoration" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
          <path d="M0,0 L7,3 L0,6 Z" fill={EDGE_COLOR.restoration} />
        </marker>
        <marker id="arrow-warning" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
          <path d="M0,0 L7,3 L0,6 Z" fill={EDGE_COLOR.warning} />
        </marker>
        <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M40 0H0V40" fill="none" stroke="#15233B" strokeWidth="1" />
        </pattern>
      </defs>
      <rect x="0" y="0" width={VBW} height={VBH} fill="url(#grid-pattern)" opacity="0.5" />

      {/* Edges */}
      {edges.map((e) => {
        const a = nodeById[e.from], b = nodeById[e.to];
        const color = EDGE_COLOR[e.status] || EDGE_COLOR.healthy;
        const isFaulted = e.status === 'faulted';
        const isRestoration = e.status === 'restoration';
        const isSelected = selected && selected.type === 'edge' && selected.id === e.id;
        const isHighlight = highlightEdge === e.id;
        const cls = isFaulted ? 'faulted-line' : isRestoration ? 'restoration-line restoration-glow' : '';
        const w = e.isTie ? 2.5 : (e.telemetry && e.telemetry.loadPct > 75 ? 4 : 3);
        // midpoint for switch marker + flow arrow
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        return (
          <g key={e.id} className="cursor-pointer" onClick={(ev) => { ev.stopPropagation(); onSelect && onSelect({ type: 'edge', id: e.id }); }}>
            {/* hit area */}
            <path d={edgePath(e)} fill="none" stroke="transparent" strokeWidth="14" />
            <path d={edgePath(e)} fill="none" stroke={color} strokeWidth={isHighlight || isSelected ? w + 2 : w}
              className={cls} strokeLinecap="round"
              markerEnd={e.status === 'healthy' ? 'url(#arrow-healthy)' : e.status === 'restoration' ? 'url(#arrow-restoration)' : e.status === 'warning' ? 'url(#arrow-warning)' : undefined}
              opacity={e.status === 'isolated' ? 0.5 : 1}
            />
            {isFaulted && (
              <g>
                <circle cx={mx} cy={my} r="7" fill="#EF4444" className="blip" />
                <path d={edgePath(e)} fill="none" stroke="#FCA5A5" strokeWidth="1" strokeDasharray="3 5" opacity="0.6" />
              </g>
            )}
            {/* switch / tie marker */}
            {(e.switch || e.isTie) && (
              <g transform={`translate(${mx} ${my})`}>
                <circle r="9" fill="#0B1120" stroke={e.switchState === 'closed' ? '#10B981' : '#64748B'} strokeWidth="2" />
                {e.isTie ? (
                  <text x="0" y="3" textAnchor="middle" fontSize="7" fill={e.switchState === 'closed' ? '#10B981' : '#94A3B8'} fontWeight="700">TS</text>
                ) : (
                  <text x="0" y="3" textAnchor="middle" fontSize="7" fill={e.switchState === 'closed' ? '#10B981' : '#94A3B8'} fontWeight="700">SW</text>
                )}
                {e.switch && <text x="0" y="22" textAnchor="middle" fontSize="8" fill="#64748B" fontFamily="JetBrains Mono">{e.switch}</text>}
              </g>
            )}
            {/* small load label on powered edges */}
            {!compact && !e.isTie && e.status !== 'faulted' && e.telemetry && (
              <text x={mx + 6} y={my - 6} fontSize="9" fill={color} fontFamily="JetBrains Mono" opacity="0.85">{e.telemetry.loadPct}%</text>
            )}
          </g>
        );
      })}

      {/* Nodes */}
      {nodes.map((n) => {
        const st = NODE_STYLE[n.type];
        const unpowered = n.powered === false;
        const isSel = selected && selected.type === 'node' && selected.id === n.id;
        const affected = n.type === 'consumer' && unpowered;
        const stroke = affected ? '#64748B' : st.stroke;
        const fillOpacity = unpowered ? 0.5 : 1;
        return (
          <g key={n.id} className="cursor-pointer" onClick={(ev) => { ev.stopPropagation(); onSelect && onSelect({ type: 'node', id: n.id }); }}
            transform={`translate(${n.x} ${n.y})`}>
            {affected && <circle r={st.r + 8} fill="none" stroke="#EF4444" strokeWidth="1.5" strokeDasharray="3 4" opacity="0.5" />}
            <circle r={st.r} fill={st.fill} fillOpacity={fillOpacity} stroke={isSel ? '#22D3EE' : stroke} strokeWidth={isSel ? 3 : 2}
              filter={unpowered ? '' : 'drop-shadow(0 0 6px ' + (st.stroke + '55') + ')'} />
            <g transform={`translate(-${st.icon === 'factory' ? 9 : 8} -${8})`} stroke={unpowered ? '#64748B' : st.stroke}>
              <Icon name={st.icon} className="w-4 h-4" />
            </g>
            <text x="0" y={st.r + 14} textAnchor="middle" fontSize="11" fill={unpowered ? '#64748B' : '#E2E8F0'} fontWeight="600">{n.name}</text>
            {n.type === 'consumer' && (
              <text x="0" y={st.r + 26} textAnchor="middle" fontSize="9" fill="#64748B" fontFamily="JetBrains Mono">{n.consumers} cons · {n.loadMW} MW</text>
            )}
            {n.type === 'feeder' && (
              <text x="0" y={st.r + 26} textAnchor="middle" fontSize="9" fill="#64748B" fontFamily="JetBrains Mono">{n.capacityMW} MW cap</text>
            )}
          </g>
        );
      })}
    </svg>
  );
}

/* Telemetry slide-over panel */
function TelemetryPanel({ grid, selection, onClose }) {
  if (!selection) return null;
  let title, sub, rows, status, extra;
  if (selection.type === 'node') {
    const n = grid.nodes.find((x) => x.id === selection.id);
    if (!n) return null;
    title = n.name;
    const typeLabel = { substation: 'Substation', feeder: 'Feeder', transformer: 'Distribution Transformer', consumer: 'Consumer Area' }[n.type];
    sub = typeLabel + ' · ID ' + n.id;
    status = n.powered === false ? 'isolated' : 'healthy';
    if (n.type === 'substation') rows = [
      ['Voltage', n.voltageKV + ' kV'], ['Capacity', n.capacityMVA + ' MVA'], ['Base Load', n.baseLoad + ' MVA'], ['Status', n.powered === false ? 'OFFLINE' : 'ENERGISED'],
    ];
    else if (n.type === 'feeder') rows = [
      ['Voltage', n.voltageKV + ' kV'], ['Capacity', n.capacityMW + ' MW'], ['Source', n.feederOf], ['Status', n.powered === false ? 'DE-ENERGISED' : 'ON'],
    ];
    else if (n.type === 'transformer') rows = [
      ['Secondary Voltage', n.voltageKV + ' kV'], ['Capacity', n.capacityKVA + ' kVA'], ['Status', n.powered === false ? 'DE-ENERGISED' : 'LOADED'],
    ];
    else rows = [
      ['Consumers', n.consumers], ['Load', n.loadMW + ' MW'], ['Type', n.tag], ['Status', n.powered === false ? 'DISCONNECTED' : 'SUPPLIED'],
    ];
  } else {
    const e = grid.edges.find((x) => x.id === selection.id);
    if (!e) return null;
    title = e.name;
    sub = 'Line · ' + e.from + ' → ' + e.to + (e.switch ? ' · ' + e.switch : '');
    status = e.status;
    const t = e.telemetry || {};
    rows = [
      ['Voltage', (t.voltageKV != null ? t.voltageKV + ' kV' : '—')],
      ['Current', (t.currentA != null ? t.currentA + ' A' : '—')],
      ['Load', (t.loadPct != null ? t.loadPct + ' %' : '—')],
      ['Power Flow', (t.powerMW != null ? t.powerMW + ' MW' : '—')],
      ['Switch', e.switch || '—'],
      ['Switch State', e.switchState || '—'],
    ];
    extra = e.isTie ? <div className="mt-2 text-xs text-slate-400">Normally-open tie switch — closes during restoration to backfeed downstream feeder.</div> : null;
  }
  return (
    <div className="fixed inset-0 z-40 flex justify-end" onClick={onClose}>
      <div className="absolute inset-0 bg-black/40" />
      <div className="relative w-full max-w-sm bg-grid-card border-l border-grid-border h-full overflow-y-auto slide-in" onClick={(ev) => ev.stopPropagation()}>
        <div className="flex items-center justify-between px-4 py-3 border-b border-grid-border/60">
          <div className="flex items-center gap-2">
            <Icon name="activity" className="w-4 h-4 text-restoration" />
            <span className="text-xs uppercase tracking-wider text-slate-400 font-semibold">Live Telemetry</span>
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-100"><Icon name="x" className="w-5 h-5" /></button>
        </div>
        <div className="p-4">
          <div className="flex items-center justify-between">
            <div>
              <div className="text-base font-bold text-slate-50">{title}</div>
              <div className="text-xs text-slate-400">{sub}</div>
            </div>
            <Badge status={status} />
          </div>
          <div className="mt-4">
            {rows.map(([k, v]) => <StatRow key={k} label={k} value={v} />)}
          </div>
          {extra}
          <div className="mt-4 text-[10px] text-slate-500 font-mono">Sampled {fmtTime(NOW())} · SCADA-BESCOM-T9</div>
        </div>
      </div>
    </div>
  );
}

/* Dashboard: KPI cards + Interactive Network Map + Fault-to-Recovery Status Banner */
function DashboardPage() {
  const { grid } = useGrid();
  const [selection, setSelection] = useState(null);
  const k = grid.kpis;
  const phase = grid.statusPhase;
  const activeFault = grid.faults.find((f) => f.id === grid.activeFaultId);

  const banner = (() => {
    const map = {
      healthy: { step: 0, total: 4, color: 'healthy', icon: 'checkCircle', title: 'Grid Operating Normally', body: 'All feeders energised. No active faults. Network in steady-state nominal condition.' },
      fault_detected: { step: 1, total: 4, color: 'faulted', icon: 'siren', title: 'Fault Detected — Protective Relays Tripping', body: activeFault ? activeFault.desc : 'Anomaly detected. Protection scheme activated.' },
      localised: { step: 2, total: 4, color: 'warning', icon: 'crosshair', title: 'Fault Localised & Isolated', body: activeFault ? ('Relay trip sequence complete. Faulted segment: ' + activeFault.edgeName + '. ' + (activeFault.affectedDesc || '') + '.') : 'Fault segment isolated.' },
      planning: { step: 3, total: 4, color: 'restoration', icon: 'route', title: 'Restoration Plan Computed', body: 'Decision engine evaluating alternative supply paths and capacity constraints.' },
      restoring: { step: 3, total: 4, color: 'restoration', icon: 'refresh', title: 'Restoration In Progress', body: 'Executing switching actions — backfeeding affected areas via tie-switch.' },
      restored: { step: 4, total: 4, color: 'healthy', icon: 'checkCircle', title: 'Supply Restored', body: 'Self-healing complete. Affected areas re-energised via alternative route.' },
      no_route: { step: 3, total: 4, color: 'faulted', icon: 'ban', title: 'No Feasible Restoration Route', body: 'Alternative feeders exceed thermal capacity. Manual dispatch / crew required.' },
    };
    return map[phase] || map.healthy;
  })();
  const steps = ['Detect', 'Localise', 'Plan', 'Restore'];

  return (
    <div className="space-y-5">
      {/* Status Banner */}
      <div className={"rounded-xl border p-4 flex items-start gap-4 " + (banner.color === 'healthy' ? 'border-healthy/40 bg-healthy/5' : banner.color === 'faulted' ? 'border-faulted/40 bg-faulted/5' : banner.color === 'warning' ? 'border-warning/40 bg-warning/5' : 'border-restoration/40 bg-restoration/5')}>
        <div className={"w-11 h-11 rounded-lg flex items-center justify-center shrink-0 " + (banner.color === 'healthy' ? 'bg-healthy/15 text-healthy' : banner.color === 'faulted' ? 'bg-faulted/15 text-faulted' : banner.color === 'warning' ? 'bg-warning/15 text-warning' : 'bg-restoration/15 text-restoration')}>
          <Icon name={banner.icon} className="w-6 h-6" />
        </div>
        <div className="flex-1 min-w-0">
          <div className="flex flex-wrap items-center gap-2">
            <span className="text-xs uppercase tracking-wider text-slate-400 font-semibold">Fault-to-Recovery Status</span>
            <Badge status={banner.color === 'healthy' ? 'healthy' : banner.color === 'faulted' ? 'faulted' : banner.color === 'warning' ? 'warning' : 'restoration'} label={banner.title} />
          </div>
          <p className="text-sm text-slate-300 mt-1.5">{banner.body}</p>
          {/* progress stepper */}
          <div className="mt-3 flex items-center gap-1">
            {steps.map((s, i) => {
              const done = banner.step > i;
              const active = banner.step === i + 1 || (phase === 'healthy' && i === 0);
              const cls = done ? 'bg-healthy text-grid-bg' : active ? 'bg-restoration text-grid-bg' : 'bg-grid-card text-slate-500';
              return (
                <div key={s} className="flex items-center gap-1">
                  <div className={"px-2.5 py-1 rounded-md text-[11px] font-semibold font-mono " + cls}>{(i + 1).toString().padStart(2, '0')} {s}</div>
                  {i < steps.length - 1 && <div className={"w-4 h-px " + (done ? 'bg-healthy' : 'bg-grid-border')}></div>}
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {/* KPI cards */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <KPICard icon="gauge" label="Grid Health" value={k.gridHealthPct} unit="%" sub="of segments healthy" accent={k.gridHealthPct >= 80 ? 'healthy' : k.gridHealthPct >= 50 ? 'warning' : 'faulted'} trend={null} />
        <KPICard icon="zap" label="Active Feeders" value={k.activeFeeders} unit="/ 3" sub="energised feeders" accent="restoration" />
        <KPICard icon="users" label="Affected Consumers" value={k.affectedConsumers.toLocaleString()} unit="" sub="disconnected loads" accent={k.affectedConsumers > 0 ? 'faulted' : 'healthy'} />
        <KPICard icon="timer" label="Avg Restoration" value={k.avgRestorationSec} unit="s" sub={k.restoredFaults + ' restored / ' + k.totalFaults + ' faults'} accent="healthy" />
      </div>

      {/* Map + side */}
      <div className="grid grid-cols-1 xl:grid-cols-3 gap-4">
        <Card title="Interactive Network Map" icon="network" className="xl:col-span-2"
          action={<div className="flex items-center gap-2 text-[11px] text-slate-400">
            <span className="inline-flex items-center gap-1"><span className="badge-dot bg-healthy"></span>Healthy</span>
            <span className="inline-flex items-center gap-1"><span className="badge-dot bg-warning"></span>Warning</span>
            <span className="inline-flex items-center gap-1"><span className="badge-dot bg-faulted"></span>Faulted</span>
            <span className="inline-flex items-center gap-1"><span className="badge-dot bg-restoration"></span>Restore</span>
            <span className="inline-flex items-center gap-1"><span className="badge-dot bg-isolated"></span>Isolated</span>
          </div>}>
          <div className="border border-grid-border/60 rounded-lg overflow-hidden bg-grid-panel">
            <NetworkMap grid={grid} onSelect={setSelection} selected={selection} highlightEdge={activeFault ? activeFault.edgeId : null} />
          </div>
          <div className="mt-2 text-[11px] text-slate-500 flex items-center gap-2"><Icon name="eye" className="w-3.5 h-3.5" />Click any node or line for live simulated telemetry (Voltage kV, Current A, Load %, Status).</div>
        </Card>

        <div className="space-y-4">
          <Card title="Network Inventory" icon="layers">
            <div className="grid grid-cols-2 gap-2 text-sm">
              <StatRow label="Substations" value={grid.nodes.filter(n => n.type === 'substation').length} />
              <StatRow label="Feeders" value={grid.nodes.filter(n => n.type === 'feeder').length} />
              <StatRow label="Transformers" value={grid.nodes.filter(n => n.type === 'transformer').length} />
              <StatRow label="Consumer Areas" value={grid.nodes.filter(n => n.type === 'consumer').length} />
              <StatRow label="Line Segments" value={grid.edges.filter(e => !e.isTie).length} />
              <StatRow label="Tie-Switches" value={grid.edges.filter(e => e.isTie).length} />
            </div>
          </Card>
          <Card title="Active Fault" icon="siren">
            {activeFault ? (
              <div className="space-y-2">
                <div className="flex items-center justify-between">
                  <span className="text-sm font-semibold text-slate-100">{activeFault.id}</span>
                  <Badge status={activeFault.severity} />
                </div>
                <div className="text-xs text-slate-400">{activeFault.type}</div>
                <div className="text-xs text-slate-300">{activeFault.desc}</div>
                <div className="flex items-center gap-2 text-[11px] text-slate-500 font-mono pt-1"><Icon name="clock" className="w-3.5 h-3.5" />{fmtDateTime(activeFault.ts)}</div>
              </div>
            ) : (
              <div className="flex flex-col items-center py-6 text-center">
                <Icon name="checkCircle" className="w-10 h-10 text-healthy mb-2" />
                <div className="text-sm text-slate-300">No active faults</div>
                <div className="text-xs text-slate-500 mt-1">Trigger a scenario from the Simulation Centre.</div>
              </div>
            )}
          </Card>
          <Card title="Quick Actions" icon="command">
            <div className="space-y-2 text-sm">
              <div className="flex items-center justify-between"><span className="text-slate-400">Total events logged</span><span className="font-mono text-slate-200">{grid.events.length}</span></div>
              <div className="flex items-center justify-between"><span className="text-slate-400">Open anomalies</span><span className="font-mono text-slate-200">{grid.anomalies.length}</span></div>
              <div className="flex items-center justify-between"><span className="text-slate-400">SCADA node</span><span className="font-mono text-restoration">{grid.meta.scada}</span></div>
            </div>
          </Card>
        </div>
      </div>

      <TelemetryPanel grid={grid} selection={selection} onClose={() => setSelection(null)} />
    </div>
  );
}
function MonitoringPage() {
  const { grid } = useGrid();
  const rows = grid.edges.filter((e) => !e.isTie);
  const feeders = ['F1', 'F2', 'F3'];

  const hist = (fid) => grid.telemetryHistory[fid] || [];
  const vSeries = feeders.map((fid, i) => ({ name: fid, color: ['#22D3EE', '#A78BFA', '#34D399'][i], data: hist(fid).map((p) => ({ t: p.t, v: p.v })) }));
  const aSeries = feeders.map((fid, i) => ({ name: fid, color: ['#22D3EE', '#A78BFA', '#34D399'][i], data: hist(fid).map((p) => ({ t: p.t, v: p.a })) }));
  const pSeries = feeders.map((fid, i) => ({ name: fid, color: ['#22D3EE', '#A78BFA', '#34D399'][i], data: hist(fid).map((p) => ({ t: p.t, v: p.p })) }));

  const feederOf = (fid) => grid.nodes.find((n) => n.id === fid);
  const srcEdge = (fid) => grid.edges.find((e) => e.to === fid);

  return (
    <div className="space-y-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div>
          <h2 className="text-lg font-bold text-slate-100">Real-Time Grid Telemetry</h2>
          <p className="text-sm text-slate-400">Simulated SCADA samples refreshing every ~2.6s across all feeders &amp; distribution transformers.</p>
        </div>
        <div className="inline-flex items-center gap-2 text-xs text-slate-400">
          <span className="badge-dot bg-healthy blip"></span>Live stream · {fmtTime(NOW())}
        </div>
      </div>

      {/* Live charts */}
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <Card title="Voltage (kV) — Feeders" icon="zap">
          <LineChart series={vSeries} yLabel="kV" min={0} max={35} unit="" height={170} />
          <div className="mt-2 flex items-center gap-3 text-[11px]">
            {feeders.map((fid, i) => <span key={fid} className="inline-flex items-center gap-1 text-slate-400"><span className="badge-dot" style={{ background: ['#22D3EE', '#A78BFA', '#34D399'][i] }}></span>{fid}</span>)}
          </div>
        </Card>
        <Card title="Current (A) — Feeders" icon="activity">
          <LineChart series={aSeries} yLabel="A" min={0} unit="A" height={170} />
          <div className="mt-2 flex items-center gap-3 text-[11px]">
            {feeders.map((fid, i) => <span key={fid} className="inline-flex items-center gap-1 text-slate-400"><span className="badge-dot" style={{ background: ['#22D3EE', '#A78BFA', '#34D399'][i] }}></span>{fid}</span>)}
          </div>
        </Card>
        <Card title="Power Flow (MW) — Feeders" icon="barChart">
          <LineChart series={pSeries} yLabel="MW" min={0} unit="MW" height={170} />
          <div className="mt-2 flex items-center gap-3 text-[11px]">
            {feeders.map((fid, i) => <span key={fid} className="inline-flex items-center gap-1 text-slate-400"><span className="badge-dot" style={{ background: ['#22D3EE', '#A78BFA', '#34D399'][i] }}></span>{fid}</span>)}
          </div>
        </Card>
      </div>

      {/* Telemetry table */}
      <Card title="Network Telemetry Table" icon="list"
        action={<div className="text-[11px] text-slate-500 font-mono">{rows.length} segments monitored</div>}>
        <div className="overflow-x-auto -mx-4 px-4 max-h-[460px] overflow-y-auto">
          <table className="telemetry w-full text-sm">
            <thead>
              <tr className="text-[11px] uppercase tracking-wider text-slate-500">
                <th className="text-left py-2 pr-4 font-semibold">Segment</th>
                <th className="text-left py-2 pr-4 font-semibold">From → To</th>
                <th className="text-right py-2 pr-4 font-semibold">Voltage (kV)</th>
                <th className="text-right py-2 pr-4 font-semibold">Current (A)</th>
                <th className="text-right py-2 pr-4 font-semibold">Load (%)</th>
                <th className="text-right py-2 pr-4 font-semibold">Power (MW)</th>
                <th className="text-right py-2 pr-4 font-semibold">Switch</th>
                <th className="text-left py-2 font-semibold">Status</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((e) => {
                const t = e.telemetry || {};
                const loadCls = t.loadPct >= 90 ? 'text-faulted' : t.loadPct >= 78 ? 'text-warning' : 'text-slate-200';
                const barW = Math.min(100, t.loadPct || 0);
                const barColor = t.loadPct >= 90 ? '#EF4444' : t.loadPct >= 78 ? '#F59E0B' : '#10B981';
                return (
                  <tr key={e.id} className="border-t border-grid-border/40 hover:bg-grid-panel/60">
                    <td className="py-2 pr-4 text-slate-200 font-medium">{e.name}</td>
                    <td className="py-2 pr-4 text-slate-400 font-mono text-xs">{e.from} → {e.to}</td>
                    <td className={"py-2 pr-4 text-right font-mono " + (t.voltageKV < 1 && e.status === 'isolated' ? 'text-slate-600' : 'text-slate-200')}>{(t.voltageKV || 0).toFixed(2)}</td>
                    <td className={"py-2 pr-4 text-right font-mono " + (t.currentA === 0 ? 'text-slate-600' : 'text-slate-200')}>{t.currentA || 0}</td>
                    <td className="py-2 pr-4 text-right">
                      <div className="flex items-center justify-end gap-2">
                        <div className="w-16 h-1.5 bg-grid-border rounded-full overflow-hidden">
                          <div className="h-full rounded-full" style={{ width: barW + '%', background: barColor }}></div>
                        </div>
                        <span className={"font-mono w-9 text-right " + loadCls}>{t.loadPct || 0}</span>
                      </div>
                    </td>
                    <td className="py-2 pr-4 text-right font-mono text-slate-200">{(t.powerMW || 0).toFixed(2)}</td>
                    <td className="py-2 pr-4 text-right font-mono text-xs text-slate-400">{e.switch || '—'}</td>
                    <td className="py-2"><Badge status={e.status} /></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </Card>

      {/* Feeder summary tiles */}
      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
        {feeders.map((fid) => {
          const f = feederOf(fid);
          const e = srcEdge(fid);
          const t = e ? e.telemetry : {};
          return (
            <Card key={fid} title={f.name} icon="zap">
              <div className="grid grid-cols-2 gap-2">
                <StatRow label="Source" value={f.feederOf} />
                <StatRow label="Capacity" value={f.capacityMW + ' MW'} />
                <StatRow label="Voltage" value={(t.voltageKV || 0).toFixed(2) + ' kV'} good={t.voltageKV > 0} />
                <StatRow label="Current" value={(t.currentA || 0) + ' A'} good={t.currentA > 0} />
                <StatRow label="Load" value={(t.loadPct || 0) + ' %'} good={(t.loadPct || 0) < 78} />
                <StatRow label="Status" value={e ? e.status.toUpperCase() : '—'} good={e && e.status === 'healthy'} />
              </div>
            </Card>
          );
        })}
      </div>
    </div>
  );
}

                    {done && <Badge status="healthy" label="DONE" />}
                  </div>
                  <div className="text-xs text-slate-300 mt-0.5">{a.desc}</div>
                  <div className="text-[11px] text-slate-500 mt-0.5">Reason: {a.reason}</div>
                </div>
              </div>
            );
          })}
        </div>

        {/* Execution controls */}
        <div className="mt-4 flex flex-wrap items-center gap-3">
          {!executed && capPass && grid.statusPhase !== 'restored' && (
            <button onClick={() => actions.executeRestoration()} disabled={loading}
              className="px-4 py-2.5 rounded-lg bg-restoration hover:bg-restoration/90 disabled:opacity-60 text-grid-bg font-semibold text-sm inline-flex items-center gap-2 transition-colors">
              {loading ? <Icon name="refresh" className="w-4 h-4 spin-slow" /> : <Icon name="play" className="w-4 h-4" />}
              {loading ? 'Executing…' : 'Simulate Restoration'}
            </button>
          )}
          {!capPass && grid.statusPhase !== 'no_route' && (
            <button onClick={() => actions.executeRestoration()} disabled={loading}
              className="px-4 py-2.5 rounded-lg bg-faulted/80 hover:bg-faulted disabled:opacity-60 text-white font-semibold text-sm inline-flex items-center gap-2">
              <Icon name="ban" className="w-4 h-4" />Confirm No Feasible Route
            </button>
          )}
          {executed && grid.statusPhase === 'restored' && (
            <div className="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-healthy/15 border border-healthy/40 text-healthy text-sm font-semibold"><Icon name="checkCircle" className="w-4 h-4" />Restoration executed — Areas re-energised via {plan.tieSwitch}</div>
          )}
          <button onClick={() => actions.resetGrid()} className="px-3 py-2.5 rounded-lg bg-grid-card border border-grid-border text-slate-200 text-sm hover:bg-grid-surface inline-flex items-center gap-2"><Icon name="rotateCcw" className="w-4 h-4" />Reset Grid</button>
        </div>
      </Card>

      <TelemetryPanel grid={grid} selection={selection} onClose={() => setSelection(null)} />
    </div>
  );
}
function SimulationPage() {
  const { grid, loading, actions } = useGrid();
  const scenarios = [
    {
      id: 'S1', name: 'Scenario 1 — Line Fault (Restorable)',
      tag: 'Self-Healing Success', tagColor: 'restoration',
      icon: 'siren', accent: 'border-warning/40 bg-warning/5',
      btnCls: 'bg-warning/90 hover:bg-warning text-grid-bg',
      summary: 'Permanent line fault on 33kV incomer Substation Alpha → Feeder F2. Areas B & C lose supply. Restorable via Tie-Switch TS-1 backfeed from Feeder F3.',
      details: [
        'Fault location: E-SUBA-F2 (Incomer A→F2)',
        'Affected: Area B + Area C (~3,500 consumers, 4.06 MW)',
        'Restoration path: F3 → TS-1 (close) → DT-102/DT-103',
        'Capacity check: F3 (8 MW) can absorb 4.06 MW → PASS',
        'Outcome: Automated self-healing restores both areas.',
      ],
      outcome: 'Restored',
    },
    {
      id: 'S2', name: 'Scenario 2 — Double-Fault / Peak Load (No Route)',
      tag: 'No Feasible Route', tagColor: 'faulted',
      icon: 'ban', accent: 'border-faulted/40 bg-faulted/5',
      btnCls: 'bg-faulted/90 hover:bg-faulted text-white',
      summary: 'Line fault on A→F2 during system peak. Feeder F3 simultaneously at thermal limit (Area D load spiked to 6.7 MW). Tie restoration infeasible — exceeds capacity.',
      details: [
        'Fault location: E-SUBA-F2 (Incomer A→F2)',
        'Secondary condition: F3 thermal overload (Area D = 6.7 MW)',
        'Affected: Area B + Area C remain isolated',
        'Capacity check: F3 projected 10.76 MW > 8 MW cap → FAIL',
        'Outcome: No feasible route — manual dispatch required.',
      ],
      outcome: 'No Route',
    },
    {
      id: 'S3', name: 'Scenario 3 — Reset Grid to Healthy',
      tag: 'System Reset', tagColor: 'healthy',
      icon: 'rotateCcw', accent: 'border-healthy/40 bg-healthy/5',
      btnCls: 'bg-healthy/90 hover:bg-healthy text-grid-bg',
      summary: 'Restore the entire virtual network to nominal healthy state. Clears all active faults, anomalies, relay sequences and restoration plans.',
      details: [
        'All line segments → healthy',
        'All switches → nominal (TS-1 open)',
        'Telemetry → nominal values',
        'Fault & anomaly logs retained in Event History',
        'Grid health returns to 100%.',
      ],
      outcome: 'Reset',
    },
  ];

  const active = grid.activeFaultId ? grid.faults.find((f) => f.id === grid.activeFaultId) : null;

  return (
    <div className="space-y-5">
      <div>
        <h2 className="text-lg font-bold text-slate-100">Simulation Centre</h2>
        <p className="text-sm text-slate-400">Trigger preset fault scenarios to exercise the full fault-to-recovery pipeline — detection, localisation, restoration planning &amp; execution.</p>
      </div>

      {/* Current state strip */}
      <Card title="Current Grid State" icon="gauge">
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">
          <StatRow label="Status phase" value={grid.statusPhase.toUpperCase()} good={grid.statusPhase === 'healthy' || grid.statusPhase === 'restored'} />
          <StatRow label="Active fault" value={grid.activeFaultId || 'None'} good={!grid.activeFaultId} />
          <StatRow label="Grid health" value={grid.kpis.gridHealthPct + '%'} good={grid.kpis.gridHealthPct >= 80} />
          <StatRow label="Affected consumers" value={grid.kpis.affectedConsumers.toLocaleString()} good={grid.kpis.affectedConsumers === 0} />
        </div>
      </Card>

      {/* Scenario cards */}
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        {scenarios.map((s) => (
          <div key={s.id} className={"rounded-xl border p-4 flex flex-col " + s.accent}>
            <div className="flex items-start justify-between">
              <div className="w-11 h-11 rounded-lg bg-grid-card border border-grid-border flex items-center justify-center">
                <Icon name={s.icon} className={"w-6 h-6 " + (s.tagColor === 'faulted' ? 'text-faulted' : s.tagColor === 'restoration' ? 'text-warning' : 'text-healthy')} />
              </div>
              <Badge status={s.tagColor} label={s.tag} />
            </div>
            <h3 className="text-sm font-bold text-slate-100 mt-3">{s.name}</h3>
            <p className="text-xs text-slate-400 mt-1.5 flex-1">{s.summary}</p>
            <ul className="mt-3 space-y-1 text-[11px] text-slate-400">
              {s.details.map((d, i) => (
                <li key={i} className="flex items-start gap-1.5"><span className="text-restoration mt-0.5">›</span><span>{d}</span></li>
              ))}
            </ul>
            <button onClick={() => actions.triggerScenario(s.id)} disabled={loading}
              className={"mt-4 w-full px-3 py-2.5 rounded-lg font-semibold text-sm inline-flex items-center justify-center gap-2 disabled:opacity-60 transition-colors " + s.btnCls}>
              {loading ? <Icon name="refresh" className="w-4 h-4 spin-slow" /> : <Icon name={s.id === 'S3' ? 'rotateCcw' : 'play'} className="w-4 h-4" />}
              {loading ? 'Running…' : (s.id === 'S3' ? 'Reset Grid' : 'Inject Fault')}
            </button>
          </div>
        ))}
      </div>

      {/* Pipeline preview */}
      <Card title="Fault-to-Recovery Pipeline" icon="gitBranch">
        <div className="grid grid-cols-2 md:grid-cols-5 gap-2">
          {[
            { step: 'Detect', icon: 'siren', desc: 'Anomaly threshold breach', done: grid.statusPhase !== 'healthy' },
            { step: 'Localise', icon: 'crosshair', desc: 'Relay trip & isolate', done: ['localised', 'planning', 'restoring', 'restored', 'no_route'].includes(grid.statusPhase) },
            { step: 'Analyse', icon: 'cpu', desc: 'Graph path search', done: ['planning', 'restoring', 'restored', 'no_route'].includes(grid.statusPhase) },
            { step: 'Restore', icon: 'route', desc: 'Switching execution', done: ['restoring', 'restored'].includes(grid.statusPhase) },
            { step: 'Verify', icon: 'shieldCheck', desc: 'Supply confirmed', done: grid.statusPhase === 'restored' },
          ].map((p, i) => {
            const cls = p.done ? 'border-healthy/50 bg-healthy/10 text-healthy' : 'border-grid-border bg-grid-panel/50 text-slate-500';
            return (
              <div key={p.step} className={"rounded-lg border p-3 " + cls}>
                <div className="flex items-center gap-2">
                  <Icon name={p.icon} className="w-4 h-4" />
                  <span className="text-xs font-bold uppercase">{(i + 1).toString().padStart(2, '0')} {p.step}</span>
                </div>
                <div className="text-[11px] mt-1 opacity-80">{p.desc}</div>
              </div>
            );
          })}
        </div>
        {active && (
          <div className="mt-3 text-xs text-slate-400">
            Active scenario <span className="font-mono text-restoration">{active.scenarioId}</span> · fault <span className="font-mono text-warning">{active.id}</span> · phase <span className="font-mono text-slate-200">{grid.statusPhase}</span>
          </div>
        )}
      </Card>
    </div>
  );
}
function HistoryPage() {
  const { grid, actions } = useGrid();
  const [typeFilter, setTypeFilter] = useState('all');
  const [query, setQuery] = useState('');
  const [refreshing, setRefreshing] = useState(false);

  const events = useMemo(() => {
    let evs = grid.events;
    if (typeFilter !== 'all') evs = evs.filter((e) => e.type === typeFilter);
    if (query.trim()) { const q = query.toLowerCase().trim(); evs = evs.filter((e) => (e.detail || '').toLowerCase().includes(q) || (e.location || '').toLowerCase().includes(q) || (e.faultId || '').toLowerCase().includes(q)); }
    return evs;
  }, [grid.events, typeFilter, query]);

  const typeMeta = {
    fault: { label: 'Fault', color: 'faulted', icon: 'siren' },
    localisation: { label: 'Localisation', color: 'warning', icon: 'crosshair' },
    switching: { label: 'Switching', color: 'restoration', icon: 'wrench' },
    restoration: { label: 'Restoration', color: 'restoration', icon: 'route' },
    reset: { label: 'Reset', color: 'healthy', icon: 'rotateCcw' },
  };
  const outcomeMeta = {
    detected: { label: 'Detected', color: 'faulted' },
    localised: { label: 'Localised', color: 'warning' },
    executed: { label: 'Executed', color: 'restoration' },
    restored: { label: 'Restored', color: 'healthy' },
    no_route: { label: 'No Route', color: 'faulted' },
    reset: { label: 'Reset', color: 'healthy' },
  };

  const doRefresh = async () => { setRefreshing(true); await actions.refresh(); setRefreshing(false); };
  const counts = ['all', 'fault', 'localisation', 'switching', 'restoration', 'reset'].map((t) => ({ t, n: t === 'all' ? grid.events.length : grid.events.filter((e) => e.type === t).length }));

  return (
    <div className="space-y-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div>
          <h2 className="text-lg font-bold text-slate-100">Event History — Audit Log</h2>
          <p className="text-sm text-slate-400">Filterable record of faults, localisation results, switching actions &amp; final restoration outcomes.</p>
        </div>
        <button onClick={doRefresh} className="px-3 py-2 rounded-lg bg-grid-card border border-grid-border text-slate-200 text-sm hover:bg-grid-surface inline-flex items-center gap-2">
          <Icon name={refreshing ? 'refresh' : 'rotateCcw'} className={"w-4 h-4 " + (refreshing ? 'spin-slow' : '')} />Refresh
        </button>
      </div>

      {/* Filters */}
      <Card title="Filters" icon="filter">
        <div className="flex flex-col md:flex-row gap-3">
          <div className="flex flex-wrap gap-2">
            {counts.map((c) => {
              const active = typeFilter === c.t;
              const label = c.t === 'all' ? 'All' : (typeMeta[c.t] ? typeMeta[c.t].label : c.t);
              return (
                <button key={c.t} onClick={() => setTypeFilter(c.t)}
                  className={"px-3 py-1.5 rounded-lg text-xs font-semibold border inline-flex items-center gap-2 transition-colors " + (active ? 'bg-restoration/15 border-restoration/50 text-restoration' : 'bg-grid-panel/50 border-grid-border text-slate-400 hover:text-slate-200')}>
                  {label} <span className="font-mono opacity-70">{c.n}</span>
                </button>
              );
            })}
          </div>
          <div className="relative md:ml-auto md:w-72">
            <Icon name="search" className="w-4 h-4 text-slate-500 absolute left-3 top-2.5" />
            <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search detail, location, fault ID…"
              className="w-full bg-grid-panel border border-grid-border rounded-lg pl-9 pr-3 py-2 text-sm text-slate-100 focus:border-restoration focus:outline-none" />
          </div>
        </div>
      </Card>

      {/* Table */}
      <Card title="Audit Log" icon="list"
        action={<span className="text-[11px] text-slate-500 font-mono">{events.length} of {grid.events.length} entries</span>}>
        {events.length === 0 ? (
          <div className="flex flex-col items-center py-12 text-center">
            <Icon name="list" className="w-12 h-12 text-slate-600 mb-2" />
            <div className="text-sm text-slate-300 font-semibold">No events match filters</div>
            <div className="text-xs text-slate-500 mt-1">Trigger a scenario or clear filters to see the audit trail.</div>
          </div>
        ) : (
          <div className="overflow-x-auto -mx-4 px-4 max-h-[560px] overflow-y-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-[11px] uppercase tracking-wider text-slate-500">
                  <th className="text-left py-2 pr-4 font-semibold">Timestamp</th>
                  <th className="text-left py-2 pr-4 font-semibold">Type</th>
                  <th className="text-left py-2 pr-4 font-semibold">Fault ID</th>
                  <th className="text-left py-2 pr-4 font-semibold">Location</th>
                  <th className="text-left py-2 pr-4 font-semibold">Detail</th>
                  <th className="text-left py-2 font-semibold">Outcome</th>
                </tr>
              </thead>
              <tbody>
                {events.map((e) => {
                  const tm = typeMeta[e.type] || { label: e.type, color: 'isolated', icon: 'activity' };
                  const om = outcomeMeta[e.outcome] || { label: e.outcome, color: 'isolated' };
                  return (
                    <tr key={e.id} className="border-t border-grid-border/40 hover:bg-grid-panel/50 align-top">
                      <td className="py-2.5 pr-4 font-mono text-xs text-slate-400 whitespace-nowrap">{fmtDateTime(e.ts)}</td>
                      <td className="py-2.5 pr-4"><Badge status={tm.color} label={tm.label} /></td>
                      <td className="py-2.5 pr-4 font-mono text-xs text-restoration">{e.faultId || '—'}</td>
                      <td className="py-2.5 pr-4 text-xs text-slate-300">{e.location || '—'}</td>
                      <td className="py-2.5 pr-4 text-xs text-slate-300 max-w-md">{e.detail}{e.durationSec != null ? <span className="ml-1 text-slate-500 font-mono">({e.durationSec}s)</span> : null}</td>
                      <td className="py-2.5"><Badge status={om.color} label={om.label} /></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </Card>

      {/* Outcome summary */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
        <KPICard icon="siren" label="Total Faults" value={grid.kpis.totalFaults} unit="" sub="detected events" accent="faulted" />
        <KPICard icon="checkCircle" label="Restored" value={grid.kpis.restoredFaults} unit="" sub="self-healed" accent="healthy" />
        <KPICard icon="ban" label="No-Route" value={grid.events.filter((e) => e.outcome === 'no_route').length} unit="" sub="manual dispatch" accent="faulted" />
        <KPICard icon="timer" label="Avg Restore" value={grid.kpis.avgRestorationSec} unit="s" sub="across restored events" accent="restoration" />
      </div>
    </div>
  );
}
/* ===== END STUBS ===== */

/* ---------------------------------------------------------------------
   App shell
--------------------------------------------------------------------- */
function Shell({ user, onLogout }) {
  const [page, setPage] = useState('dashboard');
  const [menuOpen, setMenuOpen] = useState(false);
  const labelMap = Object.fromEntries(PAGES.map((p) => [p.id, p.label]));
  const render = () => {
    switch (page) {
      case 'dashboard': return <DashboardPage />;
      case 'monitoring': return <MonitoringPage />;
      case 'fault-detect': return <FaultDetectPage />;
      case 'fault-local': return <FaultLocalPage />;
      case 'affected': return <AffectedPage />;
      case 'restoration': return <RestorationPage />;
      case 'simulation': return <SimulationPage />;
      case 'history': return <HistoryPage />;
      default: return <DashboardPage />;
    }
  };
  return (
    <div className="flex min-h-screen bg-grid-bg">
      <Sidebar page={page} setPage={setPage} open={menuOpen} setOpen={setMenuOpen} />
      <div className="flex-1 flex flex-col min-w-0">
        <TopBar user={user} onLogout={onLogout} pageLabel={labelMap[page]} onMenu={() => setMenuOpen(true)} />
        <main className="flex-1 overflow-y-auto p-4 lg:p-6">
          <div key={page} className="fade-in max-w-[1600px] mx-auto">{render()}</div>
        </main>
      </div>
    </div>
  );
}

function App() {
  const [user, setUser] = useState(null);
  return (
    <GridProvider>
      {user ? <Shell user={user} onLogout={() => setUser(null)} /> : <Login onLogin={setUser} />}
    </GridProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
